name: Build Crypto Toolkit .exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: |
          pyinstaller crypto_gui.py `
            --onefile `
            --windowed `
            --name CryptoToolkit `
            --hidden-import=cryptography.hazmat.primitives.asymmetric.ed25519 `
            --hidden-import=cryptography.hazmat.primitives.asymmetric.x25519 `
            --hidden-import=cryptography.hazmat.primitives.ciphers.aead `
            --hidden-import=cryptography.hazmat.primitives.kdf.hkdf `
            --hidden-import=argon2.low_level

      - run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item crypto_gui.spec -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: CryptoToolkit-exe
          path: dist/CryptoToolkit.exe
          retention-days: 30
